<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ڕۆژی لەدایکبوونت پیرۆز ❤️</title>
  <!-- فۆنتی کوردی رەبەر (Rabar) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rabar:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(ellipse at bottom, #0d1b2a 0%, #03050a 100%);
      height: 100vh;
      overflow: hidden;
      font-family: 'Rabar', 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      direction: rtl;
      position: relative;
    }

    /* ئاسمانی ئەستێرەکان */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      background-color: white;
      border-radius: 50%;
      animation: twinkle 3s infinite alternate;
      box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.6);
    }

    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.3); }
    }

    /* کۆنتێنەری تێکست */
    .message-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 800px;
      background: rgba(10, 20, 40, 0.5);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 215, 150, 0.2);
      text-align: center;
      color: #f7e9c3;
      border: 1px solid rgba(255, 255, 200, 0.2);
      transition: all 0.5s ease;
    }

    .typewriter-text {
      font-size: 1.7rem;
      line-height: 2.2;
      font-weight: 400;
      color: #ffefcf;
      text-shadow: 0 0 10px rgba(255, 200, 100, 0.6);
      min-height: 120px;
      word-break: break-word;
      white-space: pre-wrap;
      letter-spacing: 0.5px;
      transition: all 0.3s;
    }

    .big-final {
      font-size: 5.5rem;
      font-weight: 700;
      color: #e6b86a;
      text-shadow: 0 0 25px #b8860b, 0 0 45px #ffbb2e;
      margin-top: 0.8rem;
      letter-spacing: 6px;
      animation: gentleGlow 2.5s infinite alternate;
      opacity: 0;
      transition: opacity 1.5s ease;
      line-height: 1.2;
    }

    .big-final.visible {
      opacity: 1;
    }

    @keyframes gentleGlow {
      0% { text-shadow: 0 0 20px #d49b3b, 0 0 35px #b57c1c; }
      100% { text-shadow: 0 0 35px #f5c542, 0 0 60px #f0b323; }
    }

    /* بۆ شاشە بچووکەکان */
    @media (max-width: 600px) {
      .typewriter-text {
        font-size: 1.2rem;
        line-height: 2;
      }
      .big-final {
        font-size: 3.5rem;
      }
      .message-container {
        padding: 1.8rem 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- ئاسمانی ئەستێرەکان بە شێوەیەکی داینامیکی دروست دەکرێت -->
  <div class="stars" id="starsContainer"></div>

  <div class="message-container" id="messageCard">
    <div class="typewriter-text" id="typewriter"></div>
    <div class="big-final" id="finalText">مەرگ جوان</div>
  </div>

  <script>
    (function() {
      // دروستکردنی ئەستێرەکان بە شێوەیەکی هەڕەمەکی
      function createStars(count = 200) {
        const container = document.getElementById('starsContainer');
        container.innerHTML = '';
        for (let i = 0; i < count; i++) {
          const star = document.createElement('div');
          star.className = 'star';
          const size = Math.random() * 3.5 + 1.2; // قەبارە لە نێوان 1.2 بۆ 4.7
          const x = Math.random() * 100;
          const y = Math.random() * 100;
          const duration = Math.random() * 4 + 2.5;
          const delay = Math.random() * 3;
          
          star.style.width = `${size}px`;
          star.style.height = `${size}px`;
          star.style.left = `${x}%`;
          star.style.top = `${y}%`;
          star.style.animationDuration = `${duration}s`;
          star.style.animationDelay = `${delay}s`;
          
          container.appendChild(star);
        }
      }

      createStars(220); // دروستکردنی 220 ئەستێرە

      // تێکستی تەواو بە پیتی کوردی (هەمان دەقی داواکراو)
      const fullText = `سڵاو کەس و کارم هیوام وایە تەمەنت پر بێت لە خێرو بەرکەت سەرتا ئەم رۆژە لەخۆم پیرۆز پاشان لەتۆ نوری چاوم جەرجی سۆر نەم توانی بەم شێوازی خۆم دەمەوێت ئەم رۆژە بە نرخ هەلبسەنگێنم بەڵام ئەوندەی توانیم کۆمەڵە قسەیەک لە ناخی دڵمەوە بکەم بێ کۆپی کردنی تێکست ئیلاهی تەمەنت پر خێرو بەرکەت بکات بۆمن ئەتو ئەو هونەرمەندەی کە بە تێپەڕینی ساڵەکان پەیکەری ژیانی خۆت لە بەردی کات دەتاشیت با تاشینەکانت ورد و پڕ لە مانا بن پریان بکە لە فەرۆی مام خدری تا پێت بڵێم ئەم فەرزادەی ئیستا دەیناسی بە مانای کەلیمە بە تەواوی نەت ناسیووە چونکە نرخی شتانێک کە بە نرخن خودی خۆیان لای من دە ئەوندە بە نرخ ترن هیوادارم رۆژەکانی تری لەدایک بوونت لای من بێت ساڵەکانی ترت لای من بێت`;

      const typewriterElement = document.getElementById('typewriter');
      const finalElement = document.getElementById('finalText');
      
      let index = 0;
      let typewriterTimer = null;

      // دوای 2 چرکە دەست بە نوسین دەکات
      function startTypewriterAfterDelay(delayMs = 2000) {
        if (typewriterTimer) clearTimeout(typewriterTimer);
        
        typewriterTimer = setTimeout(() => {
          // پاککردنەوەی هەر پێشوەختەیەک
          typewriterElement.textContent = '';
          index = 0;
          // دەستپێکردنی نوسینی هێواش
          typeNextCharacter();
        }, delayMs);
      }

      function typeNextCharacter() {
        if (index < fullText.length) {
          // زیادکردنی پیتی داهاتوو
          typewriterElement.textContent += fullText.charAt(index);
          index++;
          
          // کاتی نێوان پیتەکان: 60-90 میلی چرکە بۆ هەستی سروشتی
          const randomDelay = Math.floor(Math.random() * 35) + 55; // 55 تا 90 ms
          typewriterTimer = setTimeout(typeNextCharacter, randomDelay);
        } else {
          // تێکست تەواو بوو، ئێستا "مەرگ جوان" بە گەورەیی پیشان بدە
          finalElement.classList.add('visible');
          // دوای تەواوبوونی نوسین، تایمەر ڕادەگرێت
          if (typewriterTimer) clearTimeout(typewriterTimer);
          typewriterTimer = null;
        }
      }

      // دڵنیابوون لەوەی کە لە سەرەتادا "مەرگ جوان" شاراوەیە
      finalElement.classList.remove('visible');

      // دەستپێکردنی پرۆسەکە دوای 2 چرکە
      startTypewriterAfterDelay(2000);

      // پاککردنەوەی تایمەر لە کاتی داخستنی پەڕە (خۆپارێزی)
      window.addEventListener('beforeunload', () => {
        if (typewriterTimer) clearTimeout(typewriterTimer);
      });

      // بۆ ئەوەی ئەگەر شاشە بچووک بێتەوە ئەستێرەکان دووبارە ڕێکبخەیت (ئارەزوومەندانە)
      window.addEventListener('resize', () => {
        // تەنها ئەستێرەکان دووبارە دروست دەکەینەوە بەڵام کاریگەری لەسەر تێکست نییە
        createStars(220);
      });

    })();
  </script>
</body>
</html>
