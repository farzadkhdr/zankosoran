<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بانگێشتی مارەکردن - فەرزاد و ڕەیان</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Tajawal:wght@300;400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            font-family: 'Tajawal', 'Playfair Display', serif;
            overflow: hidden;
        }

        .container {
            width: 400px;
            height: 700px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 100px rgba(212, 175, 55, 0.1);
        }

        /* ذرات طلایی شناور */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, #d4af37 0%, transparent 70%);
            border-radius: 50%;
            animation: floatParticle linear infinite;
            opacity: 0;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(105%) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10%) scale(1.5);
                opacity: 0;
            }
        }

        /* حلقه طلایی مرکزی */
        .rings-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
        }

        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            border: 2px solid transparent;
            transform: translate(-50%, -50%);
            animation: rotateRing 20s linear infinite;
        }

        .ring:nth-child(1) {
            width: 280px;
            height: 280px;
            border-color: rgba(212, 175, 55, 0.3);
            animation-duration: 20s;
        }

        .ring:nth-child(2) {
            width: 240px;
            height: 240px;
            border-color: rgba(212, 175, 55, 0.2);
            animation-duration: 25s;
            animation-direction: reverse;
        }

        .ring:nth-child(3) {
            width: 320px;
            height: 320px;
            border-color: rgba(212, 175, 55, 0.15);
            animation-duration: 30s;
        }

        @keyframes rotateRing {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* قلب */
        .heart-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .heart {
            width: 60px;
            height: 60px;
            position: relative;
            animation: heartbeat 1.2s ease-in-out infinite;
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 48px;
            background: linear-gradient(135deg, #d4af37, #ffd700);
            border-radius: 30px 30px 0 0;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        .heart::before {
            left: 30px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.1);
            }
            50% {
                transform: scale(1);
            }
            75% {
                transform: scale(1.15);
            }
        }

        /* محتوای متن */
        .content {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            padding: 40px 20px;
        }

        .invitation-text {
            color: #d4af37;
            font-size: 1.1rem;
            letter-spacing: 3px;
            margin-top: 60px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.5s;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .names-container {
            text-align: center;
            margin: 20px 0;
        }

        .name {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            opacity: 0;
            animation: fadeInScale 1s ease forwards;
            line-height: 1.4;
        }

        .name-ferzad {
            animation-delay: 1s;
        }

        .name-and {
            font-size: 1.5rem;
            color: #d4af37;
            display: block;
            margin: 5px 0;
            opacity: 0;
            animation: fadeInScale 1s ease forwards 1.5s;
        }

        .name-rayan {
            animation-delay: 2s;
        }

        .separator {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 15px auto;
            opacity: 0;
            animation: expandLine 1s ease forwards 2.5s;
        }

        @keyframes expandLine {
            from {
                width: 0;
                opacity: 0;
            }
            to {
                width: 80px;
                opacity: 1;
            }
        }

        .date-container {
            text-align: center;
            margin-top: 15px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 3s;
        }

        .date-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        .date-number {
            color: #d4af37;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 5px;
            margin-top: 5px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .phrase {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-top: 30px;
            text-align: center;
            line-height: 1.8;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 3.5s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* گوشه‌های تزئینی */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            border-color: #d4af37;
            border-style: solid;
            opacity: 0;
            animation: fadeIn 1s ease forwards 0.8s;
        }

        .corner-tl {
            top: 30px;
            left: 30px;
            border-width: 2px 0 0 2px;
            border-radius: 15px 0 0 0;
        }

        .corner-tr {
            top: 30px;
            right: 30px;
            border-width: 2px 2px 0 0;
            border-radius: 0 15px 0 0;
        }

        .corner-bl {
            bottom: 30px;
            left: 30px;
            border-width: 0 0 2px 2px;
            border-radius: 0 0 0 15px;
        }

        .corner-br {
            bottom: 30px;
            right: 30px;
            border-width: 0 2px 2px 0;
            border-radius: 0 0 15px 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 0.6;
            }
        }

        /* درخشش مرکزی */
        .glow-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: glowPulse 3s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes glowPulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 0.8;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ذرات طلایی -->
        <div class="particles" id="particles"></div>

        <!-- درخشش مرکزی -->
        <div class="glow-center"></div>

        <!-- حلقه‌ها -->
        <div class="rings-container">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
        </div>

        <!-- قلب -->
        <div class="heart-container">
            <div class="heart"></div>
        </div>

        <!-- گوشه‌های تزئینی -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <!-- محتوا -->
        <div class="content">
            <p class="invitation-text">✦ بەخێربێن ✦</p>
            <div class="names-container">
                <span class="name name-ferzad">فەرزاد</span>
                <span class="name-and">&</span>
                <span class="name name-rayan">ڕەیان</span>
            </div>
            <div class="separator"></div>
            <div class="date-container">
                <p class="date-label">ڕێکەوتی مارەکردن</p>
                <p class="date-number">12 / 12 / 2026</p>
            </div>
            <p class="phrase">
                بەخێربێن بۆ ئاهەنگی<br>
                مارەکردنی یەکگرتنی دوو دڵ<br>
                بە ئامادەبوونی ئێوە پیرۆز دەبێت
            </p>
        </div>
    </div>

    <script>
        // ایجاد ذرات طلایی شناور
        const particlesContainer = document.getElementById('particles');
        const particleCount = 40;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');

            const size = Math.random() * 4 + 1;
            const leftPosition = Math.random() * 100;
            const delay = Math.random() * 15;
            const duration = Math.random() * 10 + 8;

            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = leftPosition + '%';
            particle.style.animationDelay = delay + 's';
            particle.style.animationDuration = duration + 's';

            particlesContainer.appendChild(particle);
        }

        // افزودن درخشش تصادفی به نام‌ها
        setInterval(() => {
            const names = document.querySelectorAll('.name');
            const randomName = names[Math.floor(Math.random() * names.length)];
            randomName.style.textShadow = '0 0 40px rgba(212, 175, 55, 0.9), 0 0 80px rgba(255, 215, 0, 0.5)';
            setTimeout(() => {
                randomName.style.textShadow = '0 0 30px rgba(212, 175, 55, 0.5)';
            }, 500);
        }, 3000);
    </script>
</body>
</html>
