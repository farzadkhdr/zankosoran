<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فەرزاد ❤️ رەیان</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#f8d7ff,#d9e8ff);
}

.container{
position:relative;
perspective:1500px;
}

.envelope{
width:340px;
height:230px;
position:relative;
cursor:pointer;
transform-style:preserve-3d;
transition:1.2s;
}

.back{
position:absolute;
width:100%;
height:100%;
background:#ff8fa3;
border-radius:10px;
overflow:hidden;
}

.back:before{
content:'';
position:absolute;
width:100%;
height:100%;
background:#ff6f91;
clip-path:polygon(0 0,50% 50%,100% 0);
}

.front{
position:absolute;
width:100%;
height:100%;
background:#ff4d6d;
clip-path:polygon(0 0,100% 0,50% 55%);
transform-origin:top;
transition:1s;
z-index:10;
}

.letter{
position:absolute;
left:5%;
top:5%;
width:90%;
height:90%;
background:white;
border-radius:10px;
padding:20px;
overflow:hidden;
transform:translateY(40px);
transition:1.2s;
z-index:2;
box-shadow:0 10px 20px rgba(0,0,0,.2);
}

.open .front{
transform:rotateX(-180deg);
}

.open .letter{
transform:translateY(-120px);
height:470px;
}

h1{
font-size:30px;
text-align:center;
color:#ff4d6d;
margin-bottom:15px;
}

#text{
font-size:20px;
line-height:2;
text-align:center;
white-space:pre-wrap;
color:#444;
}

.hearts{
position:absolute;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
}

.heart{
position:absolute;
bottom:-20px;
font-size:22px;
animation:fly 6s linear infinite;
opacity:.8;
}

@keyframes fly{

0%{
transform:translateY(0) scale(.5);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-110vh) scale(1.5);
opacity:0;
}

}

</style>
</head>

<body>

<div class="hearts"></div>

<div class="container">

<div class="envelope" id="env">

<div class="back"></div>

<div class="front"></div>

<div class="letter">

<h1>💍 بانگهێشت</h1>

<div id="text"></div>

</div>

</div>

</div>

<script>

const env=document.getElementById("env");

env.onclick=()=>{

env.classList.add("open");

write();

}

const message=`

بە ناوی خوای گەورە

بە دڵێکی پڕ لە خۆشی

بانگهێشتتان دەکەین بۆ
بەشداریکردن لە مارەبڕینی

🤍

فەرزاد
❤️
رەیان

📅 12/12/2026

🕓 4 ئێوارە

📍 کۆمەڵگەی رووپەسەند

ئامادەبوونی ئێوە
مایەی خۆشی ئێمەیە ❤️

`;

let i=0;

function write(){

const box=document.getElementById("text");

const timer=setInterval(()=>{

box.innerHTML+=message.charAt(i);

i++;

if(i>=message.length){

clearInterval(timer);

}

},40);

}function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤";

heart.style.left=Math.random()*100+"%";

heart.style.fontSize=(20+Math.random()*30)+"px";

heart.style.animationDuration=(4+Math.random()*4)+"s";

document.querySelector(".hearts").appendChild(heart);

setTimeout(()=>{

heart.remove();

},8000);

}

setInterval(createHeart,300);

for(let i=0;i<25;i++){

setTimeout(createHeart,i*200);

}

document.body.addEventListener("mousemove",(e)=>{

const h=document.createElement("div");

h.className="heart";

h.innerHTML="💖";

h.style.left=e.clientX+"px";

h.style.top=e.clientY+"px";

h.style.position="fixed";

h.style.fontSize="18px";

h.style.animation="fly 4s linear forwards";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},4000);

});

</script>

</body>
</html>
