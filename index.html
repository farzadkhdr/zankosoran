<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>جەژنت پیرۆز 💖 رەیان</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #1a0b0b 0%, #2d1a1a 40%, #4a2323 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Nizar', 'Rabar', 'Tahoma', sans-serif;
      padding: 20px;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }

    /* ڕازاندنەوەی پێکەوە */
    .hearts-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .heart {
      position: absolute;
      color: rgba(255, 180, 180, 0.25);
      font-size: 28px;
      user-select: none;
      animation: floatUp 7s infinite ease-in;
      opacity: 0;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(0deg) scale(0.8);
        opacity: 0.7;
      }
      50% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-10vh) rotate(30deg) scale(1.4);
        opacity: 0;
      }
    }

    .card {
      position: relative;
      z-index: 10;
      background: rgba(20, 8, 8, 0.75);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(220, 160, 140, 0.45);
      border-radius: 48px;
      padding: 35px 30px 45px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.7), 0 0 50px rgba(210, 120, 100, 0.4);
      text-align: center;
      color: #fbe9e7;
      transition: all 0.4s ease;
    }

    .message-area {
      font-size: 1.7rem;
      line-height: 2.4rem;
      min-height: 180px;
      white-space: pre-wrap;
      word-break: break-word;
      color: #ffd9cc;
      text-shadow: 0 0 12px #b34b3a;
      font-weight: 400;
      letter-spacing: 0.5px;
      margin-bottom: 30px;
      border-bottom: 1px dashed #c97b6b;
      padding-bottom: 25px;
      transition: all 0.2s;
    }

    .special-dedication {
      font-size: 2.6rem;
      font-weight: 700;
      margin-top: 25px;
      color: #ffb7a7;
      text-shadow: 0 0 20px #e65c4b, 0 0 40px #b52e1b;
      background: linear-gradient(to right, #ffd6cc, #ffaa8c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: glowPulse 2.2s infinite alternate;
      letter-spacing: 1px;
      line-height: 3.4rem;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.2s ease, transform 1s ease;
    }

    .special-dedication.show {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes glowPulse {
      0% {
        text-shadow: 0 0 15px #c0452f, 0 0 35px #a1301f;
      }
      100% {
        text-shadow: 0 0 30px #ff7b5c, 0 0 65px #e6391e;
      }
    }

    .cursor {
      display: inline-block;
      width: 3px;
      background: #ffb09c;
      margin-right: 4px;
      animation: blink 1s step-end infinite;
      vertical-align: middle;
      height: 1.5em;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .reset-btn {
      background: rgba(255, 230, 220, 0.2);
      border: 1px solid #d69b8b;
      color: #ffeae3;
      padding: 12px 28px;
      border-radius: 40px;
      font-size: 1.2rem;
      margin-top: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: 0.3s;
      font-family: inherit;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .reset-btn:hover {
      background: rgba(190, 100, 80, 0.5);
      border-color: #fca18d;
      box-shadow: 0 0 25px #d94e3b;
      color: white;
    }

    @media (max-width: 500px) {
      .message-area {
        font-size: 1.3rem;
        line-height: 2rem;
      }
      .special-dedication {
        font-size: 1.9rem;
      }
    }
  </style>
</head>
<body>
  <!-- دڵەکانی باکگراوند بۆ ئاشقانەبوون -->
  <div class="hearts-container" id="heartsContainer"></div>

  <div class="card">
    <div class="message-area" id="typedMessage">
      <span id="textContainer"></span><span class="cursor" id="cursorSpan"></span>
    </div>

    <!-- دەقی تایبەت کە دوای تەواوبوون دەردەکەوێت -->
    <div class="special-dedication" id="specialText">
      رەیانم شەکرە سێوەکەم مەرگ جوانی من
    </div>

    <button class="reset-btn" id="replayBtn">🔄 دووبارە بینینەوەی نامەکە</button>
  </div>

  <script>
    (function() {
      // نامە ڕاستەقینەکەت بە هەمان شێوەی داخواوت
      const fullMessage = "چەژنت پیرۆز کەس و کارم ماڵەکەم رەیان جیان هیوادارم رۆژێک دابێت جەژن لەگەڵ من بەڕێبکەی و بەیانی کە لەخەو هەستام ماچی نیوچەوانت بکەم و پێت بلێم جەژن پیرۆز هاوسەرەکەم من نازانم قسەی نەستەلەق بکەم ئەمەوێت ئەوەی لە دڵمە ئەوانت پێ بڵێم داوا کارم لە خوای گەورەو میهرەبان ئە جەژنەت لۆ بکاتە هەزار جەژن بتگەینتە هەرچی خۆزگە و هیوای لە دڵتە پیكمان شاد بکات";
      
      const textContainer = document.getElementById('textContainer');
      const cursorSpan = document.getElementById('cursorSpan');
      const specialElement = document.getElementById('specialText');
      const replayBtn = document.getElementById('replayBtn');

      let typingInterval = null;
      let currentIndex = 0;
      let animationActive = false;

      // دروستکردنی دڵە هەڵکشاوەکان بۆ جوانی
      function createHearts() {
        const container = document.getElementById('heartsContainer');
        container.innerHTML = '';
        for (let i = 0; i < 28; i++) {
          const heart = document.createElement('span');
          heart.className = 'heart';
          heart.innerHTML = ['❤️', '🌸', '✨', '💖', '🌙', '🕊️'][Math.floor(Math.random() * 6)];
          heart.style.left = Math.random() * 100 + '%';
          heart.style.animationDelay = Math.random() * 8 + 's';
          heart.style.fontSize = (20 + Math.floor(Math.random() * 26)) + 'px';
          heart.style.animationDuration = (5 + Math.random() * 9) + 's';
          container.appendChild(heart);
        }
      }

      // ڕاگرتنی هەموو شتێک
      function stopTyping() {
        if (typingInterval) {
          clearInterval(typingInterval);
          typingInterval = null;
        }
      }

      // شاردنەوەی دەقی تایبەت و ریسێتکردن
      function resetAndStart() {
        stopTyping();
        // شاردنەوەی دەقی خوارەوە
        specialElement.classList.remove('show');
        // پاککردنەوەی تێکست
        textContainer.textContent = '';
        currentIndex = 0;
        animationActive = true;
        // دڵنیابوون لەوەی کێرسۆر دیارە
        cursorSpan.style.display = 'inline-block';
        
        // دەستپێکردنی تایپینگ
        typingInterval = setInterval(typeNextCharacter, 55); // خێرایی پیت پیت (55ms)
      }

      // نووسینی پیتی داهاتوو
      function typeNextCharacter() {
        if (currentIndex < fullMessage.length) {
          // زیادکردنی پیتی نوێ
          textContainer.textContent += fullMessage.charAt(currentIndex);
          currentIndex++;
        } else {
          // تەواو بوون
          stopTyping();
          animationActive = false;
          // شاردنەوەی کێرسۆر
          cursorSpan.style.display = 'none';
          // پیشاندانی دەقی خوارەوە بە ئەنیمەیشن
          specialElement.classList.add('show');
        }
      }

      // دووبارەکردنەوە بە دوگمە
      replayBtn.addEventListener('click', () => {
        // ئەگەر ئەنیمەیشن چالاکە، یەکەم جار بیوەستێنە و دووبارە دەستپێبکە
        stopTyping();
        resetAndStart();
      });

      // دەستپێکردنی سەرەتا
      createHearts();
      resetAndStart();

      // پاککردنەوە لەکاتی ڕۆیشتن (باشترە)
      window.addEventListener('beforeunload', () => {
        stopTyping();
      });

    })();
  </script>
</body>
</html>
