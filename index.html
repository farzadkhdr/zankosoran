<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جەژنی قوربان پیرۆز - رەیان</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Naskh Arabic', 'Segoe UI', Tahoma, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* لایەنی یوتوب - شاراوە */
        .youtube-container {
            position: fixed;
            bottom: -200px;
            left: -200px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        /* ئەنیمەیشنی ئەستێرەکان */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite;
            opacity: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* ئەنیمەیشنی مانگ و ئەستێرە گەورەکان */
        .moon {
            position: fixed;
            top: 30px;
            right: 50px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 60% 40%, #fffacd, #f0c040);
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(255, 200, 50, 0.8), 0 0 120px rgba(255, 180, 30, 0.6);
            animation: moonGlow 3s ease-in-out infinite;
            z-index: 0;
            opacity: 0.7;
        }

        @keyframes moonGlow {
            0%, 100% { box-shadow: 0 0 60px rgba(255, 200, 50, 0.8), 0 0 120px rgba(255, 180, 30, 0.6); }
            50% { box-shadow: 0 0 80px rgba(255, 220, 80, 1), 0 0 160px rgba(255, 200, 60, 0.9); }
        }

        /* دڵی ئەنیمەیشن */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .heart {
            position: absolute;
            font-size: 25px;
            animation: floatUp 4s linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.5) rotate(360deg);
                opacity: 0;
            }
        }

        /* کۆنتێنەری سەرەکی */
        .main-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 30px;
            padding: 40px 30px;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 0 50px rgba(255, 215, 0, 0.05);
            animation: containerGlow 4s ease-in-out infinite;
            margin: 20px;
        }

        @keyframes containerGlow {
            0%, 100% { border-color: rgba(255, 215, 0, 0.3); }
            50% { border-color: rgba(255, 215, 0, 0.7); }
        }

        /* نامەکە - ئەنیمەیشنی پیت بە پیت */
        .message-container {
            text-align: right;
            direction: rtl;
            min-height: 250px;
            position: relative;
        }

        .typed-text {
            font-size: 22px;
            color: #f5e6d3;
            line-height: 2;
            text-shadow: 0 0 10px rgba(255, 200, 100, 0.4);
            white-space: pre-wrap;
            word-wrap: break-word;
            position: relative;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 28px;
            background: #ffd700;
            animation: blink 0.7s infinite;
            margin-right: 2px;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* تێکستی گەورە لە خوارەوە */
        .big-text-container {
            margin-top: 50px;
            text-align: center;
            opacity: 0;
            animation: fadeInUp 1.5s ease-out forwards;
            animation-delay: 8s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .big-text {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700, #ffec8b, #ffb347, #ffcc00);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: goldShine 3s ease-in-out infinite;
            text-shadow: none;
            letter-spacing: 2px;
            line-height: 1.8;
        }

        @keyframes goldShine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* دیزاینی لامپەکان */
        .lantern {
            position: fixed;
            top: 10px;
            font-size: 50px;
            animation: swing 3s ease-in-out infinite;
            z-index: 0;
            opacity: 0.8;
            filter: drop-shadow(0 0 15px rgba(255, 150, 0, 0.8));
        }

        .lantern-left {
            left: 30px;
            animation-delay: 0s;
        }

        .lantern-right {
            right: 30px;
            animation-delay: 1.5s;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }

        /* پەڕەی گوڵاوی */
        .rose-petal {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            font-size: 20px;
            animation: petalFall linear infinite;
        }

        @keyframes petalFall {
            0% {
                transform: translateY(-10vh) rotate(0deg) translateX(0px);
                opacity: 1;
            }
            50% {
                transform: translateY(50vh) rotate(180deg) translateX(100px);
                opacity: 0.8;
            }
            100% {
                transform: translateY(110vh) rotate(360deg) translateX(-50px);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .big-text {
                font-size: 28px;
            }
            .typed-text {
                font-size: 17px;
                line-height: 1.8;
            }
            .main-container {
                padding: 25px 15px;
                margin: 10px;
            }
            .moon {
                width: 60px;
                height: 60px;
                top: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ئەنیمەیشنی ئەستێرەکان -->
    <div class="stars" id="starsContainer"></div>

    <!-- مانگ -->
    <div class="moon"></div>

    <!-- لامپەکان -->
    <div class="lantern lantern-right">🏮</div>
    <div class="lantern lantern-left">🏮</div>

    <!-- دڵەکان -->
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- پەڕەی گوڵاوی -->
    <div id="petalsContainer"></div>

    <!-- کۆنتێنەری سەرەکی -->
    <div class="main-container">
        <!-- نامەکە -->
        <div class="message-container">
            <p class="typed-text" id="typedMessage"></p>
            <span class="cursor" id="cursor"></span>
        </div>

        <!-- تێکستی گەورە -->
        <div class="big-text-container" id="bigTextContainer">
            <p class="big-text">
                رەیانم شەکرە سێوەکەم<br>
                مەرگ جوانی من
            </p>
        </div>
    </div>

    <!-- لایەنی یوتوب -->
    <div class="youtube-container">
        <iframe 
            id="youtubePlayer"
            width="1" 
            height="1" 
            src="https://www.youtube.com/embed/A3US5mYSZJw?autoplay=1&loop=1&playlist=A3US5mYSZJw&controls=0&showinfo=0&rel=0&mute=0&enablejsapi=1"
            frameborder="0" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        // ناونیشانی یوتوب
        const youtubeUrl = "https://youtu.be/A3US5mYSZJw?si=1X4WdWl0A6dJHfbE";

        // نامەکە
        const fullMessage = `چەژنت پیرۆز کەس و کارم ماڵەکەم رەیان جیان\nهیوادارم رۆژێک دابێت جەژن لەگەڵ من بەڕێبکەی\nو بەیانی کە لەخەو هەستام ماچی نیوچەوانت بکەم و پێت بلێم جەژن پیرۆز هاوسەرەکەم\nمن نازانم قسەی نەستەلەق بکەم ئەمەوێت ئەوەی لە دڵمە ئەوانت پێ بڵێم\nداوا کارم لە خوای گەورەو میهرەبان\nئە جەژنەت لۆ بکاتە هەزار جەژن\nبتگەینتە هەرچی خۆزگە و هیوای لە دڵتە\nپیكمان شاد بکات`;

        const typedTextElement = document.getElementById('typedMessage');
        const cursorElement = document.getElementById('cursor');
        const bigTextContainer = document.getElementById('bigTextContainer');

        let charIndex = 0;
        let typingSpeed = 70; // خێرایی نوسین (میلی چرکە)

        // فەنکشنی پیت بە پیت نوسین
        function typeMessage() {
            if (charIndex < fullMessage.length) {
                const currentChar = fullMessage.charAt(charIndex);
                
                // زیادکردنی پیت
                if (currentChar === '\n') {
                    typedTextElement.innerHTML += '<br>';
                } else {
                    typedTextElement.innerHTML += currentChar;
                }
                
                charIndex++;
                
                // خێرایی جیاواز بۆ هەندێک پیت
                let delay = typingSpeed;
                if (currentChar === ' ' || currentChar === '\n') {
                    delay = typingSpeed + 30;
                } else if (currentChar === '.' || currentChar === '،') {
                    delay = typingSpeed + 150;
                }
                
                setTimeout(typeMessage, delay);
                
                // سکرۆڵ بۆ خوارەوە بۆ دیتنی تێکستی نوێ
                typedTextElement.scrollIntoView({ behavior: 'smooth', block: 'end' });
            } else {
                // نامە تەواو بوو - کێرسۆر بکوژێنەوە
                cursorElement.style.display = 'none';
                
                // نیشاندانی تێکستی گەورە
                setTimeout(() => {
                    bigTextContainer.style.opacity = '1';
                }, 300);
            }
        }

        // دروستکردنی ئەستێرەکان
        function createStars() {
            const container = document.getElementById('starsContainer');
            const starCount = 100;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 3 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(star);
            }
        }

        // دروستکردنی دڵەکان
        function createHearts() {
            const container = document.getElementById('heartsContainer');
            const hearts = ['❤️', '💕', '💖', '💗', '💝', '✨', '🌟', '💫', '🕊️', '🌙'];

            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 95 + '%';
                heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                heart.style.animationDelay = '0s';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                container.appendChild(heart);

                // لابردنی دڵ دوای ئەنیمەیشن
                setTimeout(() => {
                    heart.remove();
                }, 4000);
            }, 300);
        }

        // دروستکردنی پەڕەی گوڵاوی
        function createPetals() {
            const container = document.getElementById('petalsContainer');
            const petals = ['🌸', '🌷', '💮', '🏵️', '🌺', '🌹', '🥀', '💐'];

            setInterval(() => {
                const petal = document.createElement('div');
                petal.classList.add('rose-petal');
                petal.textContent = petals[Math.floor(Math.random() * petals.length)];
                petal.style.left = Math.random() * 95 + '%';
                petal.style.top = '-5%';
                petal.style.animationDuration = (Math.random() * 5 + 6) + 's';
                container.appendChild(petal);

                // لابردنی پەڕە دوای ئەنیمەیشن
                setTimeout(() => {
                    petal.remove();
                }, 8000);
            }, 500);
        }

        // سەرەتاکردنی یوتوب
        function initYouTube() {
            // دروستکردنی ئەکتیڤەیشنی ئۆتۆپلەی بەکگراوند
            const iframe = document.getElementById('youtubePlayer');
            
            // ئیشکردنی یوتوب دوای کلیکێک (بەهۆی سیاسەتی ئۆتۆپلەی وێبگەڕ)
            document.addEventListener('click', function() {
                iframe.src = iframe.src;
            }, { once: true });

            // هەوڵی ئۆتۆپلەی خۆکار
            setTimeout(() => {
                iframe.src = "https://www.youtube.com/embed/A3US5mYSZJw?autoplay=1&loop=1&playlist=A3US5mYSZJw&controls=0&showinfo=0&rel=0&mute=0&enablejsapi=1&origin=" + window.location.origin;
            }, 500);
        }

        // سەرەتاکردنی هەموو شتێک
        window.addEventListener('load', () => {
            createStars();
            createHearts();
            createPetals();
            initYouTube();
            
            // دەستپێکردنی نوسینی نامەکە دوای 1.5 چرکە
            setTimeout(() => {
                typeMessage();
            }, 1500);
        });

        // دووبارە بارکردنەوەی لاپەڕە بۆ ئەنیمەیشنەکان
        window.addEventListener('beforeunload', () => {
            // Cleanup
        });
    </script>
</body>
</html>
